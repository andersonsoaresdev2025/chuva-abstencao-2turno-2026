name: Atualização automática (30 min)

# Executa os papéis dos Bots 0–4 por scripts: clima → impacto → social → notícias → site → testes,
# grava data/ e docs/ e publica. O Streamlit Community Cloud e o GitHub Pages redeployam a partir da main.
on:
  schedule:
    - cron: '*/30 9-22 * * *'   # 06:00–19:30 BRT (UTC-3), a cada 30 min
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizacao-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: '1'
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}   # opcional; sem ele a coleta no X é pulada
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-atualizacao.txt
            dashboard/requirements.txt
            mcp/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Atualizar tudo (etapas não fatais)
        env:
          PYTHON: python
          PUBLICAR: '0'          # o commit/push é feito no passo seguinte, como github-actions
        run: bash scripts/atualizar_tudo.sh

      - name: Commit e push (github-actions)
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs STATUS_PUBLICACAO.md
          if git diff --cached --quiet; then
            echo "Nada para commitar."; echo "mudou=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "Atualização automática $(date '+%Y-%m-%d %H:%M') BRT [actions]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main || git rebase --abort || true
            if git push -q origin HEAD:main; then echo "Push OK $(git rev-parse HEAD)"; break; fi
            sleep $((i * 10))
          done
          echo "mudou=1" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Push feito com GITHUB_TOKEN pode não disparar o build do Pages (branch main /docs):
      # solicita o build explicitamente pela API (não fatal).
      - name: Solicitar build do GitHub Pages
        if: steps.push.outputs.mudou == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "AVISO: não foi possível solicitar o build do Pages"

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Atualização $(date '+%Y-%m-%d %H:%M') BRT"
            echo
            echo "Commit: ${{ steps.push.outputs.sha }}"
            echo
            tail -n 5 "$(ls -t data/logs/atualizacao_*.log | head -1)" || true
            echo
            cat data/clima/atualizacoes/resumo_latest.md 2>/dev/null | head -n 40 || true
          } >> "$GITHUB_STEP_SUMMARY"
